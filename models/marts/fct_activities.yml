version: 2

models:
  - name: fct_activities
    description: >
      One row per activity/deal association (grain: activity_id + deal_id),
      enriched with activity type and assigned user. None deduplicated.
      `activity_id` repeats across rows: either an activity is genuinely linked
      to several deals, or the ids are reused - ASSUMPTION to confirm with the
      CRM owner (see the model SQL header). `deal_id` is carried but not joined
      to the deal models here - the activity and deal_changes deal populations
      are near-disjoint, so deal enrichment belongs in the presentation layer.
    meta:
      layer: marts
      grain: one row per activity event, keyed by (activity_id, deal_id)
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [activity_id, deal_id]
    columns:
      - name: activity_key
        description: Surrogate key, dbt_utils.generate_surrogate_key of (activity_id, deal_id).
        tests:
          - unique
          - not_null
      - name: activity_id
        description: >
          Source Pipedrive activity id. Not unique on its own - appears on
          multiple rows (one activity linked to several deals, or id reuse -
          assumption to verify with the business).
        tests:
          - not_null
      - name: is_activity_id_shared
        description: True when activity_id is used by another activity row too.
        tests:
          - not_null
      - name: deal_id
        description: >
          Deal the activity is attached to. Join to fct_deals in the
          presentation layer if deal context is needed (rarely matches).
        tests:
          - not_null
      - name: activity_type_key
        description: Activity type key. FK -> stg_pipedrive__activity_types.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pipedrive__activity_types')
                field: activity_type_key
      - name: activity_type_name
        description: Human label of the activity type.
        tests:
          - not_null
      - name: activity_type_is_active
        description: Whether the activity type is enabled in Pipedrive.
        tests:
          - not_null
      - name: is_done
        description: Whether the activity is completed.
        tests:
          - not_null
      - name: due_at
        description: Scheduled due date/time.
        tests:
          - not_null
      - name: assigned_user_id
        description: Assigned user. FK -> dim_users.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_users')
                field: user_id
      - name: assigned_user_name
        description: Assigned user's name.
        tests:
          - not_null
      - name: assigned_user_email
        description: Assigned user's email.
        tests:
          - not_null
