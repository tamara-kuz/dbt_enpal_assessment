version: 2

models:
  - name: stg_seed__funnel_steps
    description: >
      The sales-funnel step definitions used by rep_sales_funnel_monthly: the
      11 KPIs (pipeline stages 1-9 plus the two Sales Call sub-steps), their
      display name, and how each joins to the fact data. Sourced from the
      funnel_steps seed.
    meta:
      layer: staging
      grain: one row per funnel step
    columns:
      - name: funnel_step
        description: Step number as text - "1".."9", "2.1", "3.1". Sorts into funnel order.
        tests:
          - unique
          - not_null
      - name: kpi_name
        description: Human-readable step name (the rep_sales_funnel_monthly kpi_name).
        tests:
          - unique
          - not_null
      - name: step_kind
        description: '"stage" (join_key is a pipeline stage id) or "activity" (join_key is an activity_type_key).'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["stage", "activity"]
      - name: join_key
        description: >
          For step_kind = 'stage': the pipeline stage id ("1".."9"). For
          step_kind = 'activity': the activity_type_key ("meeting" / "sc_2").
        tests:
          - unique
          - not_null
